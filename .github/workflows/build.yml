name: Build Prism

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ========== LINUX x64 ==========
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libzip-dev \
            libsqlite3-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
          mv prism prism-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-x64
          path: prism-linux-x64

  # ========== LINUX ARM64 ==========
  build-linux-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build on ARM64
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          run: |
            apt-get update
            apt-get install -y curl clang \
              libgtk-3-dev libcurl4-openssl-dev libzip-dev libsqlite3-dev \
              pkg-config
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
            chmod +x build.sh
            ./build.sh
            mv prism prism-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-arm64
          path: prism-linux-arm64

  # ========== RELEASE ==========
  release:
    needs: [build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p ./release
          find ./artifacts -type f -exec cp {} ./release/ \;
          chmod +x ./release/*
          ls -la ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
YAML_END

