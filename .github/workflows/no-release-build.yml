
name: Build Only (No Release)

on:
  workflow_dispatch:

  push:
    branches: [master]
    paths:
      - '**.rs'
      - '**.c'
      - '**.h'
      - 'build.sh'

  schedule:
    - cron: '*/30 * * * *'

jobs:
  # ========== x64 GUI ==========
  build-linux-x64-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgtk-3-dev libcurl4-openssl-dev \
            libzip-dev libsqlite3-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
          mv prism prism-linux-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-x64
          path: prism-linux-x64
          retention-days: 7

  # ========== x64 no-GUI ==========
  build-linux-x64-nogui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev libzip-dev \
            libsqlite3-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --no-gui
          mv prism prism-linux-x64-nogui
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-x64-nogui
          path: prism-linux-x64-nogui
          retention-days: 7

  # ========== ARM64 GUI ==========
  build-linux-arm64-gui:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgtk-3-dev libcurl4-openssl-dev \
            libzip-dev libsqlite3-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
          mv prism prism-linux-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-arm64
          path: prism-linux-arm64
          retention-days: 7

  # ========== ARM64 no-GUI ==========
  build-linux-arm64-nogui:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev libzip-dev \
            libsqlite3-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --no-gui
          mv prism prism-linux-arm64-nogui
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-arm64-nogui
          path: prism-linux-arm64-nogui
          retention-days: 7
